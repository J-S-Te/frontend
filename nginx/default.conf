map $http_x_forwarded_proto $external_scheme {
    default $scheme;
    http http;
    https https;
}

# AUD-2026-023：File Gateway 的上传/下载票据经 URL 查询参数传递（?ticket=...），
# 官方镜像默认日志格式的 $request 会把整条 query 连同票据写进 access log。
# 为文件网关 location 定义不含 query 的专用格式：$request 拆为
# method + $uri（无查询串）+ protocol，其余字段与官方镜像 main 格式对齐。
# 取舍：该 location 的日志不区分任何查询串（票据与无害参数一并去除），需要
# 参数级排查时依赖 File Gateway 自身的访问审计（DOWNLOAD_TICKET_ISSUED 等）。
# 本指令位于 http 上下文（conf.d 同级，default.conf 先于 gateway.conf 解析），
# gateway.conf 等模板可按名引用，全仓库仅此一处定义。
log_format file_gateway_noquery '$remote_addr - $remote_user [$time_local] '
                                '"$request_method $uri $server_protocol" '
                                '$status $body_bytes_sent "$http_referer" '
                                '"$http_user_agent" "$http_x_forwarded_for"';

# 业务路由只在容器内部端口提供服务。公网 HTTP/HTTPS 入口由根据部署配置
# 生成的 gateway.conf 承担，避免 TLS 开关导致整套路由被复制两份。
server {
    listen 127.0.0.1:8088;
    server_name 127.0.0.1;

    root /usr/share/nginx/html;
    index index.html;

    # 不暴露 nginx 具体版本号，减少攻击面信息泄露。
    server_tokens off;

    # SEC-N9：本层是用户可见 50x（上游解析失败/超时）的实际产生点，
    # 统一回退到通用错误页，不向客户端回显 nginx 默认错误页细节。
    # 只拦截 nginx 自身产生的 500/502/503/504；后端主动返回的 5xx
    # （proxy_intercept_errors 默认关闭）原样透传，不影响 API 的 JSON 错误结构。
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        root /usr/share/nginx/html;
        default_type text/html;
    }

    # 后端安全中间件已为 API 响应设置 X-Content-Type-Options / Referrer-Policy，
    # 此处若重复设置会让反代响应出现同名双份头；静态页面在各自 location 中显式设置。
    #
    # SEC-N9：静态 HTML location 统一追加 CSP 与 X-Frame-Options（见下方各 location）。
    # 论证：
    #   - script-src 'self'：index.html / login.html 与 Vite 构建产物只有外链
    #     <script type="module" src="/assets/...">，无内联脚本，因此不需要
    #     'unsafe-inline' 或 nonce，内联脚本注入会被直接拦截（与 sanitizePreview
    #     的 XSS 修复形成纵深防御）。
    #   - style-src 'self' 'unsafe-inline'：Vue 的 :style 绑定是内联样式属性，
    #     样式无脚本执行能力，最小放开以保证缩放/进度条等功能；样式表本体仍限 'self'。
    #   - img-src / font-src 'self' data: blob:：预览与附件用本地 data:/blob: URL，
    #     不放行任意外部源。
    #   - connect-src 'self'：全部 API 走同源反代；源码中无跨源 fetch/Worker/WebSocket。
    #   - frame-src 未单列 → 落到 default-src 'self'：数据看板的同源
    #     /data_analysis/api/v1/embed-proxy iframe（task-31）可继续加载，
    #     跨源 iframe 被拒；frame-ancestors 'none' + X-Frame-Options DENY 禁止本 SPA
    #     被任何页面嵌入（embed 目标文档由后端响应头管辖，不受本配置约束）。

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    proxy_set_header X-Forwarded-Proto $external_scheme;

    # Docker 内置 DNS 可在后端容器重建后重新解析服务地址。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $platform_backend platform-api:8080;
    set $contract_backend contract-api:8081;
    set $project_backend project-api:8082;
    set $settlement_backend settlement-api:8085;
    set $customer_backend customer-api:8090;
    set $portal_backend portal-api:8091;
    set $dashboard_backend data-analysis-api:8080;
    set $file_gateway_backend file-gateway:8086;

    location = /healthz {
        proxy_pass http://$platform_backend/healthz;
    }

    location = /readyz {
        proxy_pass http://$platform_backend/readyz;
    }

    location /api/ {
        proxy_pass http://$platform_backend;
    }

    # 文件内容通过一次性上传/下载票据直达 File Gateway。禁用 Nginx 请求缓冲，
    # 避免大文件先落到 Nginx 临时目录；存储根目录从不由 Nginx 静态暴露。
    location /file-gateway/api/v2/ {
        # AUD-2026-023：本 location 单独使用不含 query 的日志格式（log_format 见文件头），
        # 仅作用于文件网关路径；其余 location 仍沿用 http 级 main 格式，不受影响。
        access_log /var/log/nginx/access.log file_gateway_noquery;
        # 上游 5xx 会经 error_page 内部跳转到 /50x.html（该 location 无独立 access_log，
        # 会以 main 格式把原始 $request 连同票据 query 记回日志）。为文件网关单独指定
        # 内容相同但日志脱敏的错误页，保证错误路径同样不含 query。
        error_page 500 502 503 504 /fg_50x.html;
        client_max_body_size 21m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 10m;
        rewrite ^/file-gateway(/api/v2/.*)$ $1 break;
        proxy_pass http://$file_gateway_backend;
    }

    # 文件网关专用 50x 错误页（AUD-2026-023）：内容与 /50x.html 同源，仅日志脱敏。
    location = /fg_50x.html {
        internal;
        access_log /var/log/nginx/access.log file_gateway_noquery;
        alias /usr/share/nginx/html/50x.html;
        default_type text/html;
    }

    # 正式接入和受控更新会串行执行镜像构建、迁移、健康检查与授权目录发布，
    # 正常耗时可能超过 Nginx 默认的 60 秒。保留平台 API 的同步结果，避免
    # 浏览器收到 502 后误以为失败并重复创建 OAuth Client。
    location = /api/v1/subsystem-onboarding {
        proxy_connect_timeout 30s;
        proxy_read_timeout 16m;
        proxy_send_timeout 16m;
        proxy_pass http://$platform_backend;
    }

    location = /api/v1/subsystem-update {
        proxy_connect_timeout 30s;
        proxy_read_timeout 16m;
        proxy_send_timeout 16m;
        proxy_pass http://$platform_backend;
    }

    location = /api/v1/subsystem-retry {
        proxy_connect_timeout 30s;
        proxy_read_timeout 16m;
        proxy_send_timeout 16m;
        proxy_pass http://$platform_backend;
    }

    location = /api/v1/subsystem-teardown {
        proxy_connect_timeout 30s;
        proxy_read_timeout 16m;
        proxy_send_timeout 16m;
        proxy_pass http://$platform_backend;
    }

    # SPA documents contain user-specific navigation state after boot. Never let a browser or
    # shared proxy reuse an old account's HTML shell during logout/login account switching.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    location = /authorize {
        # 使用变量形式的 upstream 时，不要在 proxy_pass 后追加 URI。
        # 否则 Nginx 会使用新的 URI 替换原请求，并丢失 OIDC 所需的
        # client_id、redirect_uri、state、nonce 和 PKCE 等查询参数。
        proxy_pass http://$platform_backend;
    }

    location = /.well-known/openid-configuration {
        proxy_pass http://$platform_backend/.well-known/openid-configuration;
    }

    location /oauth2/ {
        proxy_pass http://$platform_backend;
    }

    # 合同管理前端与基础平台前端位于同一个 Vue 构建产物中；仅把合同后端
    # 的会话、API 和健康检查路径转发给 contract-api，其他路径交给 Vue Router。
    location = /contract_management/healthz {
        proxy_pass http://$contract_backend/healthz;
    }

    location /contract_management/auth/ {
        # proxy_pass 使用变量时，携带 URI 会丢弃匹配位置后的剩余路径。
        # 先显式移除门户前缀，再把完整后端路径交给 contract-api。
        rewrite ^/contract_management(/auth/.*)$ $1 break;
        proxy_pass http://$contract_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_set_header X-Forwarded-Prefix /contract_management;
    }

    location = /contract_management/logged-out {
        proxy_pass http://$contract_backend/logged-out;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_set_header X-Forwarded-Prefix /contract_management;
    }

    location /contract_management/api/ {
        rewrite ^/contract_management(/api/.*)$ $1 break;
        proxy_pass http://$contract_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_set_header X-Forwarded-Prefix /contract_management;
    }

    location = /contract_management {
        return 308 /contract_management/;
    }

    location /contract_management/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ @spa;
    }

    # 项目管理与平台共用 Vue 构建产物，只把独立项目后端的会话、API、登出页
    # 和健康检查转发给 project-api；业务页面继续由 Vue Router 处理。
    location = /project_management/healthz {
        proxy_pass http://$project_backend/healthz;
    }

    # 就绪检查必须单独转发：它不在 /api/ 前缀下，缺失时会被 SPA 的 try_files 兜底成
    # 200 index.html，于是"库结构落后于代码"的部署看起来是就绪的（假绿）。
    location = /project_management/readyz {
        proxy_pass http://$project_backend/readyz;
    }

    location /project_management/auth/ {
        rewrite ^/project_management(/auth/.*)$ $1 break;
        proxy_pass http://$project_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_set_header X-Forwarded-Prefix /project_management;
    }

    location = /project_management/logged-out {
        proxy_pass http://$project_backend/logged-out;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_set_header X-Forwarded-Prefix /project_management;
    }

    location /project_management/api/ {
        rewrite ^/project_management(/api/.*)$ $1 break;
        proxy_pass http://$project_backend;
        # 确认拆解等操作会在请求路径上同步等待 Temporal 工作流完成（见
        # application.ConfirmServiceItems）；后端已对等待设置 30s 硬超时并在超时后返回
        # 明确的 JSON 错误。这里把读/写超时放宽到 120s 作为兜底，避免后端偶发慢处理时
        # 被 Nginx 默认的 60s proxy_read_timeout 提前打成 504。
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_set_header X-Forwarded-Prefix /project_management;
    }

    location = /project_management {
        return 308 /project_management/;
    }

    location /project_management/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ @spa;
    }

    # Settlement 页面仍由统一 Vue SPA 提供；仅会话、API 与探针请求进入
    # 独立结算服务，避免业务路由落到后端造成 404。
    location = /settlement/healthz { proxy_pass http://$settlement_backend/healthz; }
    location = /settlement/readyz { proxy_pass http://$settlement_backend/readyz; }
    location /settlement/auth/ {
        rewrite ^/settlement(/auth/.*)$ $1 break;
        proxy_pass http://$settlement_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_set_header X-Forwarded-Prefix /settlement;
    }
    location /settlement/api/ {
        rewrite ^/settlement(/api/.*)$ $1 break;
        proxy_pass http://$settlement_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_set_header X-Forwarded-Prefix /settlement;
    }
    location = /settlement { return 308 /settlement/; }
    location /settlement/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ @spa;
    }

    # 客户与商机管理前端也位于统一 Vue 构建产物中。其后端原生保留
    # /customer-opportunity 前缀，因此转发时不重写 URI。
    location = /customer-opportunity/healthz {
        proxy_pass http://$customer_backend;
    }

    location /customer-opportunity/auth/ {
        proxy_pass http://$customer_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_set_header X-Forwarded-Prefix /customer-opportunity;
    }

    location /customer-opportunity/api/ {
        proxy_pass http://$customer_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_set_header X-Forwarded-Prefix /customer-opportunity;
    }

    location = /customer-opportunity {
        return 308 /customer-opportunity/;
    }

    location /customer-opportunity/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ @spa;
    }

    # 客户自助门户前端仍由统一 Vue 产物承载，外部客户的 HttpOnly Session、OIDC
    # 回调和业务 API 则只进入隔离的 portal-api 进程。
    location = /customer-portal/healthz {
        proxy_pass http://$portal_backend;
    }

    location /customer-portal/auth/ {
        proxy_pass http://$portal_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_set_header X-Forwarded-Prefix /customer-portal;
    }

    # 客户自助门户激活链接由 portal-api 处理（签发 OIDC 授权跳转），不能交给 SPA。
    location = /customer-portal/activate {
        proxy_pass http://$portal_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_set_header X-Forwarded-Prefix /customer-portal;
    }

    location /customer-portal/api/ {
        proxy_pass http://$portal_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_set_header X-Forwarded-Prefix /customer-portal;
    }

    location = /customer-portal {
        return 308 /customer-portal/;
    }

    location /customer-portal/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ @spa;
    }

    # 数据看板与统计分析：随统一前端构建（frontend/src/modules/data_analysis），
    # 只把后端会话、API、健康检查转发给 dashboard-api；页面由 Vue Router 处理。
    location = /data_analysis/healthz {
        proxy_pass http://$dashboard_backend/data_analysis/healthz;
    }

    location = /data_analysis/readyz {
        proxy_pass http://$dashboard_backend/data_analysis/readyz;
    }

    # dashboard-api 的路由自带 /data_analysis 前缀（gin PathPrefix），
    # 因此这里保留前缀转发，不做 rewrite（区别于 contract/project 的无前缀后端）。
    location /data_analysis/auth/ {
        proxy_pass http://$dashboard_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_set_header X-Forwarded-Prefix /data_analysis;
    }

    location = /data_analysis/logged-out {
        proxy_pass http://$dashboard_backend/logged-out;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_set_header X-Forwarded-Prefix /data_analysis;
    }

    location /data_analysis/api/ {
        proxy_pass http://$dashboard_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_set_header X-Forwarded-Prefix /data_analysis;
    }

    location = /data_analysis {
        return 308 /data_analysis/;
    }

    location /data_analysis/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ @spa;
    }

    # 这里只保留真正独立部署的子系统；随统一前端构建的合同、项目、客户商机
    # 与数据看板模块不得在此配置整站代理。
    include /etc/nginx/portal-apps.d/*.conf;

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ @spa;
    }

    location @spa {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        try_files /index.html =404;
    }
}
