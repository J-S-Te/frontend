server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://g.alicdn.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-src https://login.dingtalk.com https://*.dingtalk.com" always;

    # 传递原始请求来源，供后端生成回调地址、审计和安全判断。
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 通过前端同源地址暴露健康检查，方便本地验证和容器编排诊断。
    location = /healthz {
        proxy_pass http://api:8080/healthz;
    }

    location = /readyz {
        proxy_pass http://api:8080/readyz;
    }

    # 保留 /api/v1 路径，供前端 REST 请求使用。
    location /api/ {
        proxy_pass http://api:8080;
    }

    # OIDC/OAuth 端点不在 /api/v1 下，同样通过同源反向代理公开。
    location = /authorize {
        proxy_pass http://api:8080/authorize;
    }

    location = /.well-known/openid-configuration {
        proxy_pass http://api:8080/.well-known/openid-configuration;
    }

    location /oauth2/ {
        proxy_pass http://api:8080;
    }

    # Vue Router 使用 history 模式，未命中静态资源时回退到入口页。
    # 子系统统一入口由 platform/scripts/portal-gateway.sh 维护；空文件保证默认容器也能启动。
    include /etc/nginx/portal-apps.d/*.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
