server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # 传递原始请求来源，供后端生成回调地址、审计和安全判断。
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 使用 Docker 内置 DNS 动态解析后端容器，避免 API 容器重建后 Nginx 保留旧 IP。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $platform_backend platform-api:8080;

    # 通过前端同源地址暴露健康检查，方便本地验证和容器编排诊断。
    location = /healthz {
        proxy_pass http://$platform_backend/healthz;
    }

    location = /readyz {
        proxy_pass http://$platform_backend/readyz;
    }

    # 保留 /api/v1 路径，供前端 REST 请求使用。
    location /api/ {
        proxy_pass http://$platform_backend;
    }

    # OIDC/OAuth 端点不在 /api/v1 下，同样通过同源反向代理公开。
    location = /authorize {
        proxy_pass http://$platform_backend/authorize;
    }

    location = /.well-known/openid-configuration {
        proxy_pass http://$platform_backend/.well-known/openid-configuration;
    }

    location /oauth2/ {
        proxy_pass http://$platform_backend;
    }

    # Vue Router 使用 history 模式，未命中静态资源时回退到入口页。
    # 子系统统一入口由 platform/scripts/portal-gateway.sh 维护；空文件保证默认容器也能启动。
    include /etc/nginx/portal-apps.d/*.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
