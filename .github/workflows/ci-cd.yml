name: frontend-ci-cd

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.event_name == 'pull_request' && github.ref || 'test' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  image:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_ref: ${{ steps.result.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v5
      - id: vars
        shell: bash
        env:
          ACR_PUSH_REGISTRY: ${{ vars.ACR_PUSH_REGISTRY }}
          ACR_PULL_REGISTRY: ${{ vars.ACR_PULL_REGISTRY }}
          ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
          ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
        run: |
          set -Eeuo pipefail
          : "${ACR_PUSH_REGISTRY:?missing ACR_PUSH_REGISTRY}"
          : "${ACR_PULL_REGISTRY:?missing ACR_PULL_REGISTRY}"
          : "${ACR_NAMESPACE:?missing ACR_NAMESPACE}"
          : "${ACR_REPOSITORY:?missing ACR_REPOSITORY}"
          echo "image=${ACR_PUSH_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "deploy_image=${ACR_PULL_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPOSITORY}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_PUSH_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.vars.outputs.image }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            VITE_API_BASE_URL=/api/v1
            VITE_LOGIN_SUCCESS_URL=/
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - id: result
        shell: bash
        run: echo "image_ref=${{ steps.vars.outputs.deploy_image }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Deploy immutable frontend image
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE_REF: ${{ needs.image.outputs.image_ref }}
          DEPLOY_RELAX_RUNTIME_PERM_CHECK: "true"
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?missing DEPLOY_KNOWN_HOSTS}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/basic-platform}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          # 将前端专用的宽松权限开关显式传到远端进程。新版发布脚本不会读取或修改
          # 子系统 runtime 文件；该开关仅兼容尚未更新发布资产的过渡服务器。
          printf -v remote_command 'cd %q && DEPLOY_RELAX_RUNTIME_PERM_CHECK=true ./bin/deploy-service.sh frontend %q' "$DEPLOY_PATH" "$IMAGE_REF"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command"
