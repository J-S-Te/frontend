name: frontend-ci-cd

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      modules:
        description: "VITE_ENABLED_MODULES：all、none 或逗号分隔的业务模块编码（如 contract_management,project_management）"
        type: string
        default: all
        required: false

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.event_name == 'pull_request' && github.ref || 'test' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify module selection builds
        run: npm run verify:modules
      - name: Design token hardcode gate
        run: npm run audit:design-tokens
      - name: Verify frontend deployment prerequisites
        run: bash scripts/test-deploy-frontend.sh
      - run: npm run build

  # 布局断点回归：真实模块 CSS + 真实组件，全部在浏览器内渲染，不依赖后端与 dev server。
  # 与 test 并列（push/PR 默认执行），不进 image/deploy 依赖链；失败时 harness 会打印
  # 具体 module/width/height/order 与边界断言明细。
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Resolve Chrome binary
        shell: bash
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          set -Eeuo pipefail
          candidate="$CHROMIUM_PATH"
          if [ ! -x "$candidate" ]; then
            candidate="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          fi
          if [ -z "$candidate" ] || [ ! -x "$candidate" ]; then
            echo "::error::找不到可用 Chrome/Chromium，布局回归无法执行（不静默跳过）。"
            exit 1
          fi
          echo "CHROMIUM_PATH=$candidate" >> "$GITHUB_ENV"
          "$candidate" --version
      - name: Layout boundary regression
        env:
          LAYOUT_OUTPUT_DIR: ${{ github.workspace }}/layout-evidence/${{ github.run_id }}
        run: npm run test:layout
      - name: Upload layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-evidence
          path: layout-evidence/
          retention-days: 7
          if-no-files-found: warn

  image:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_ref: ${{ steps.result.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v5
      - id: vars
        shell: bash
        env:
          ACR_PUSH_REGISTRY: ${{ vars.ACR_PUSH_REGISTRY }}
          ACR_PULL_REGISTRY: ${{ vars.ACR_PULL_REGISTRY }}
          ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
          ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
        run: |
          set -Eeuo pipefail
          : "${ACR_PUSH_REGISTRY:?missing ACR_PUSH_REGISTRY}"
          : "${ACR_PULL_REGISTRY:?missing ACR_PULL_REGISTRY}"
          : "${ACR_NAMESPACE:?missing ACR_NAMESPACE}"
          : "${ACR_REPOSITORY:?missing ACR_REPOSITORY}"
          echo "image=${ACR_PUSH_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "deploy_image=${ACR_PULL_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPOSITORY}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_PUSH_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.vars.outputs.image }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            VITE_ENABLED_MODULES=${{ inputs.modules || 'all' }}
            VITE_API_BASE_URL=/api/v1
            VITE_LOGIN_SUCCESS_URL=/
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - id: result
        shell: bash
        run: echo "image_ref=${{ steps.vars.outputs.deploy_image }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v5
      - name: Deploy immutable frontend image
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE_REF: ${{ needs.image.outputs.image_ref }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?missing DEPLOY_KNOWN_HOSTS}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/unified-identity-platform}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf -v remote_command 'bash -s -- %q %q' "$DEPLOY_PATH" "$IMAGE_REF"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command" < scripts/deploy-frontend-remote.sh
