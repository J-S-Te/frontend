<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="基础能力平台系统设置与审计日志" />
    <title>系统设置 · 基础能力平台</title>
    <!--
      首帧前同步主题偏好，避免深色用户每次刷新都先看到一帧白底。
      读取的键与取值来自门户主题开关（basic-platform.portal-theme: light | dark | system），
      运行期由 src/modules/platform/shared/composables/useDocumentTheme.js 接管，
      两处共用同一份偏好契约；未保存偏好时保持浅色（与升级前一致）。

      CSP 契约：生产 nginx 的 script-src 只有 'self' 与本段脚本的内容哈希
      'sha256-OF0/LJQ5qh8t7oBqc+JC5cNwj9RPCu//WFj4f5RNDcw='（见 nginx/default.conf）。
      本段脚本逐字节变化都会让哈希失配、脚本在生产被拦截（深色用户重新出现白闪），
      因此改动后必须同步更新 nginx/default.conf 中全部 script-src 的哈希；
      npm run build 的 themeCspHashPlugin 会校验，失配直接构建失败。
      login.html 里是同一段脚本（同一哈希），两处必须保持一致。
    -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('basic-platform.portal-theme')
          var dark = stored === 'dark' || (stored === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
