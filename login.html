<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="基础能力平台统一登录入口" />
    <title>登录 · 基础能力平台</title>
    <!--
      首帧前同步主题偏好，避免深色用户每次刷新都先看到一帧白底。
      本段与 index.html 里的主题引导脚本逐字节相同，共用同一个 CSP 哈希
      'sha256-OF0/LJQ5qh8t7oBqc+JC5cNwj9RPCu//WFj4f5RNDcw='（生产 nginx 的
      script-src 只有 'self' 与这个哈希，见 nginx/default.conf）。
      改动本段必须同步更新 nginx/default.conf 中全部 script-src 的哈希，
      npm run build 的 themeCspHashPlugin 会校验；两处脚本也必须保持一致。
    -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('basic-platform.portal-theme')
          var dark = stored === 'dark' || (stored === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
